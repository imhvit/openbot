services:
  redis:
    image: redis:alpine
    container_name: redis_local
    ports:
      - "6379:6379"
    restart: unless-stopped
  lavalink:
    image: fredboat/lavalink:4
    container_name: lavalink_local
    restart: unless-stopped
    ports:
      - "2333:2333"
    volumes:
      - ./docker/lavalink/application.yml:/opt/Lavalink/application.yml
    env_file:
      - .env
    environment:
      - _JAVA_OPTIONS=-Xmx1G
